# Harness ECS task definition (RegisterTaskDefinition request, lower camel case).
# Hello world: public nginx image. The "version" is the manifest SHA, passed as an env var.
# force_bad_release: when FORCE_BAD is "true" the container still serves, but a busy
# loop pins the CPU. The canary looks up, and Verify (CloudWatch CPUUtilization,
# higher is risk) should flag it against the primary, so the stage rolls back.
# (The earlier crash-at-start design was not caught by the canary step or Verify;
# it only rolled back after the rolling deploy timed out.)
family: steelthread-app
requiresCompatibilities:
  - FARGATE
networkMode: awsvpc
cpu: "256"
memory: "512"
executionRoleArn: arn:aws:iam::759984737373:role/ecsTaskExecutionRole
containerDefinitions:
  - name: app
    image: public.ecr.aws/nginx/nginx:stable-alpine
    essential: true
    portMappings:
      - containerPort: 80
        protocol: tcp
    environment:
      - name: CANDIDATE_SHA
        value: "<+serviceVariables.candidate_sha>"
      - name: ENV_ID
        value: "<+serviceVariables.env_id>"
      - name: FORCE_BAD
        value: "<+serviceVariables.force_bad>"
    entryPoint:
      - sh
      - -c
    command:
      - 'echo "steelthread $CANDIDATE_SHA" > /usr/share/nginx/html/index.html; if [ "$FORCE_BAD" = "true" ]; then echo "bad release $CANDIDATE_SHA: CPU hog"; (while :; do :; done) & fi; exec nginx -g "daemon off;"'
tags:
  - key: demo
    value: tetrascience
  - key: owner
    value: alex.soto
