# Remote template for deploy_intt_lambda and deploy_prod_lambda (fetched from Git,
# to show remote vs inline templates).
# Stands in for "release state that ships with a release". A DynamoDB table is
# used (not SQS/SSM) because the account.AWS connector user lacks SQS create
# and SSM write rights; see tracker §7.
AWSTemplateFormatVersion: "2010-09-09"
Description: Steel Thread demo - lambda release-state table (DynamoDB, on-demand)
Parameters:
  CandidateSha:
    Type: String
  EnvId:
    Type: String
Resources:
  ReleaseTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub steelthread-${EnvId}-lambda-state
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      Tags:
        - Key: demo
          Value: tetrascience
        - Key: owner
          Value: alex.soto
        - Key: deployed_sha
          Value: !Ref CandidateSha
Outputs:
  TableName:
    Value: !Ref ReleaseTable
  DeployedSha:
    Value: !Ref CandidateSha
