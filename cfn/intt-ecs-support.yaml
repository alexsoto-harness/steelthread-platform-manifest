# Copy of the inline template used by the CloudFormation Create Stack step in
# deploy_intt_ecs and deploy_prod_ecs. For readers; the pipeline carries it inline.
# Stands in for "queues and parameters" that ship with a release.
AWSTemplateFormatVersion: "2010-09-09"
Description: Steel Thread demo - ECS support resources (SSM parameter + SQS queue)
Parameters:
  CandidateSha:
    Type: String
  EnvId:
    Type: String
Resources:
  DeployedSha:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /steelthread/${EnvId}/ecs/deployed_sha
      Type: String
      Value: !Ref CandidateSha
      Tags:
        demo: tetrascience
        owner: alex.soto
  WorkQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub steelthread-${EnvId}-ecs-work
      Tags:
        - Key: demo
          Value: tetrascience
        - Key: owner
          Value: alex.soto
        - Key: candidate_sha
          Value: !Ref CandidateSha
Outputs:
  QueueUrl:
    Value: !Ref WorkQueue
  ShaParameter:
    Value: !Ref DeployedSha
